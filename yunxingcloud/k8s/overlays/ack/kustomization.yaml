# Alibaba Cloud ACK (Container Service for Kubernetes) 生产环境 Overlay
# 用法: kubectl apply -k k8s/overlays/ack/
#
# 前置条件:
#   1. 创建 ACK 集群 (标准托管版, 2节点起)
#   2. 创建 ACR 仓库 (registry.cn-hangzhou.aliyuncs.com/<namespace>)
#   3. 创建 RDS MySQL 8.0 + Redis 6.0 (或使用集群内部署)
#   4. 配置 SLB 或 ALB Ingress
#   5. 域名解析到 SLB IP

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: yunxingcloud

resources:
  - ../../namespace.yaml
  - ../../configmap.yaml
  - ../../secret.yaml
  - ../../service.yaml
  - ../../deployment.yaml
  - ../../ingress.yaml
  - ../../hpa.yaml
  - ../../networkpolicy.yaml
  - ../../pdb.yaml
  - storageclass.yaml
  - pvc.yaml

# 替换镜像为 ACR 地址
images:
  - name: yunxingcloud-core
    newName: registry.cn-hangzhou.aliyuncs.com/yunxingcloud/yunxingcloud-core
    newTag: latest
  - name: yunxingcloud-usercenter
    newName: registry.cn-hangzhou.aliyuncs.com/yunxingcloud/yunxingcloud-usercenter
    newTag: latest
  - name: yunxingcloud-gateway
    newName: registry.cn-hangzhou.aliyuncs.com/yunxingcloud/yunxingcloud-gateway
    newTag: latest
  - name: yunxingcloud-payment
    newName: registry.cn-hangzhou.aliyuncs.com/yunxingcloud/yunxingcloud-payment
    newTag: latest
  - name: yunxingcloud-order
    newName: registry.cn-hangzhou.aliyuncs.com/yunxingcloud/yunxingcloud-order
    newTag: latest
  - name: yunxingcloud-inventory
    newName: registry.cn-hangzhou.aliyuncs.com/yunxingcloud/yunxingcloud-inventory
    newTag: latest

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: yunxingcloud
  app.kubernetes.io/environment: production
