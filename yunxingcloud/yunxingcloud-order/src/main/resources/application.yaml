jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD:yunxingcloud@2024}

spring:
  application:
    name: yunxingcloud-order
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
  messages:
    basename: i18n/messages
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
    connection-timeout: 5s
    socket-timeout: 10s
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/yunxingcloud_order?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:ENC(6VGcqDaUyxnDMjR2b1ltITeT71DkI7a0dB8ntg53T58RWc/aAzshU7WUPfk2o5xH)}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  # Flyway 迁移说明：
  # 开发环境使用 ddl-auto=update 快速迭代 schema
  # 生产环境请启用 Flyway (enabled: true) + ddl-auto: validate
  # migration 脚本位于 src/main/resources/db/migration/ (已有 V1-V21)
  flyway:
    enabled: false
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        import-check:
          enabled: false
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 30000
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8082}
      eager: true
  data:
    elasticsearch:
      repositories:
        enabled: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

management:
  health:
    elasticsearch:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

server:
  port: 8084
logging:
  level:
    com.yunxingcloud: INFO
