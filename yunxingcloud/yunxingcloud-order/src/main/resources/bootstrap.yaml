# Nacos 配置中心
# 使用方式: 启动时设置 NACOS_SERVER=nacos.yunxingcloud.com:8848
spring:
  application:
    name: yunxingcloud-order
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        refresh-enabled: true
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}

# Nacos 管理的配置项 (在本地开发时作为 fallback)
# 生产环境这些配置应从 Nacos 控制台管理
app:
  cache:
    redis:
      enabled: ${REDIS_CACHE_ENABLED:true}
    ttl:
      hot-products: 30m
      new-products: 15m
      categories: 1h
      brands: 1h
      banners: 30m
      product-detail: 10m
      home-data: 5m
