<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>YXCLOUD 商城 — 品质生活，一站购齐</title>

  <meta name="keywords" content="YXCLOUD,商城,购物,秒杀,拼团,优惠券,微信支付,支付宝"/>
  <meta name="theme-color" content="#e4393c"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="apple-touch-icon" href="/favicon.svg"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

  <!-- Open Graph -->
  <meta property="og:title" content="YXCLOUD 商城 — 品质生活，一站购齐"/>
  <meta property="og:description" content="海量商品、限时秒杀、拼团优惠、全国包邮"/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="YXCLOUD 商城"/>
  <meta property="og:image" content="/favicon.svg"/>

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="YXCLOUD 商城 — 品质生活，一站购齐"/>
  <meta name="twitter:description" content="海量商品、限时秒杀、拼团优惠、全国包邮"/>

  <link rel="dns-prefetch" href="//www.yunxingcloud.com"/>
  <link rel="preconnect" href="//www.yunxingcloud.com"/>
  <link rel="preload" href="/favicon.svg" as="image" type="image/svg+xml"/>

  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;padding:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji';background:#f5f5f5;color:#333;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
    [v-cloak]{display:none}
    #nprogress-bar{position:fixed;top:0;left:0;width:0%;height:3px;background:linear-gradient(90deg,#f10215,#ff6b6b,#f10215);z-index:9999;box-shadow:0 0 8px rgba(241,2,21,.5);transition:none;pointer-events:none;border-radius:0 2px 2px 0}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "YXCLOUD 商城",
    "url": "https://www.yunxingcloud.com",
    "description": "品质生活，一站购齐",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://www.yunxingcloud.com/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>
<body>
  <div id="sr-announcer" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0" aria-live="polite" aria-atomic="true"></div>
  <div id="app-loading" style="display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,sans-serif;color:#999;font-size:14px;gap:16px">
    <div style="width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:#e4393c;border-radius:50%;animation:spin .6s linear infinite"></div>
    <span id="app-loading-text">加载中...</span>
  </div>
  <div id="app" v-cloak></div>
  <div id="nprogress-bar"></div>
  <div id="app-error" style="display:none;text-align:center;padding:40px 20px;font-family:system-ui,sans-serif">
    <h2 style="color:#e4393c">⚠ 加载失败</h2>
    <p id="err-msg" style="color:#666;margin:8px 0">请检查网络连接后刷新页面</p>
    <button onclick="location.reload()" style="margin-top:12px;padding:10px 24px;background:#e4393c;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer">重新加载</button>
  </div>
  <script>
    window._errors=[]
    window.onerror=function(m){window._errors.push(m);document.getElementById('app-error').style.display='block';var a=document.getElementById('app');if(a){a.removeAttribute('v-cloak');document.getElementById('app-loading').style.display='none'}}
    window.addEventListener('unhandledrejection',function(e){window._errors.push('P:'+(e.reason||'').toString().slice(0,60));document.getElementById('app-error').style.display='block'})
    // Hide loading indicator when Vue mounts (v-cloak removed)
    new MutationObserver(function(ms){ms.forEach(function(m){if(m.attributeName==='v-cloak'&&!document.getElementById('app').hasAttribute('v-cloak')){document.getElementById('app-loading').style.display='none'}})}).observe(document.getElementById('app'),{attributes:true})
    // Safety timeout: show hint at 10s, error at 30s
    var _t1=setTimeout(function(){var t=document.getElementById('app-loading-text');if(t)t.textContent='正在加载，请耐心等待...'},10000)
    var _t2=setTimeout(function(){var a=document.getElementById('app');if(a&&a.hasAttribute('v-cloak')){a.removeAttribute('v-cloak');document.getElementById('app-loading').style.display='none';document.getElementById('app-error').style.display='block'}},30000)
  </script>
  <script type="module" src="/src/main.ts"></script>
  <script defer src="/web-vitals.js"></script>
</body>
</html>
