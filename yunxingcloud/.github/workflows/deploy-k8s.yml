name: Deploy to K8s

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options: ['staging', 'production']

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: maven }
      - run: ./mvnw test -q --no-transfer-progress

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core, usercenter, gateway, payment, order, inventory]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: maven }

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build JAR & Docker Image
        run: |
          ./mvnw package -pl yunxingcloud-${{ matrix.service }} -DskipTests -q --no-transfer-progress
          case ${{ matrix.service }} in
            core) PORT=8080;; usercenter) PORT=8081;; gateway) PORT=8090;;
            payment) PORT=8083;; order) PORT=8084;; inventory) PORT=8085;;
          esac
          JAR="yunxingcloud-${{ matrix.service }}/target/yunxingcloud-${{ matrix.service }}-0.0.1-SNAPSHOT.jar"
          docker build --build-arg JAR_FILE="$JAR" --build-arg PORT=$PORT \
            -t $REGISTRY/yunxingcloud-${{ matrix.service }}:${{ github.sha }} \
            -t $REGISTRY/yunxingcloud-${{ matrix.service }}:latest \
            -f Dockerfile.local .
          docker push $REGISTRY/yunxingcloud-${{ matrix.service }}:${{ github.sha }}
          docker push $REGISTRY/yunxingcloud-${{ matrix.service }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to K8s
        run: |
          for svc in core usercenter gateway payment order inventory; do
            kubectl set image deployment/yunxingcloud-$svc -n yunxingcloud \
              app=$REGISTRY/yunxingcloud-$svc:${{ github.sha }}
            kubectl rollout status deployment/yunxingcloud-$svc -n yunxingcloud --timeout=120s
          done

      - name: Health Check
        run: |
          kubectl wait --for=condition=ready pod \
            -l 'app in (yunxingcloud-core,yunxingcloud-usercenter,yunxingcloud-gateway,yunxingcloud-payment,yunxingcloud-order,yunxingcloud-inventory)' \
            -n yunxingcloud --timeout=180s
          echo "=== All 6 services healthy ==="
          kubectl get pods -n yunxingcloud
