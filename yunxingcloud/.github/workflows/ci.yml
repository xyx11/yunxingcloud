name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: yunxingcloud_test
        ports: [3306]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Run Backend Tests
        run: mvn test -B -pl yunxingcloud-order,yunxingcloud-core,yunxingcloud-usercenter -am
        env:
          JWT_SECRET: ci-test-secret-key-min-256-bits-long
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/yunxingcloud_test
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: test123

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-mall/package-lock.json

      - name: Install & Test Mall Frontend
        working-directory: frontend-mall
        run: |
          npm ci --legacy-peer-deps
          npm run type-check
          npm run test

  admin-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Test Admin Frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run type-check
          npm run test
